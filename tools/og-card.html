<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Preview card</title>
<style>
:root { --night:#070910; --ink:#e6eaf4; --dim:#95a2c4; --amber:#ffb347; --cyan:#22e5ff; --pink:#ff2e88; --line:#243050; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--night); }
body { position: relative; font-family: "Barlow", sans-serif; color: var(--ink); }
#bg { position: absolute; inset: 0; }
.txt { position: absolute; left: 72px; top: 92px; width: 600px; }
.label { font-family: "Share Tech Mono", monospace; font-size: 20px; letter-spacing: .22em; color: var(--cyan); }
h1 { font-family: "Chakra Petch", sans-serif; font-weight: 700; font-size: 104px; line-height: .95; letter-spacing: .06em; margin: 22px 0 0; color: var(--amber); text-shadow: 0 0 8px rgba(255,179,71,.55), 0 0 40px rgba(255,140,40,.45); }
h1 span { display: block; font-size: 42px; letter-spacing: .55em; color: var(--cyan); margin-top: 16px; text-shadow: 0 0 12px rgba(34,229,255,.6); }
p { font-size: 27px; line-height: 1.35; margin: 34px 0 0; color: var(--ink); max-width: 520px; }
.chips { display: flex; gap: 12px; margin-top: 30px; }
.chips b { font-family: "Share Tech Mono", monospace; font-weight: 400; font-size: 17px; letter-spacing: .12em; border: 1.5px solid var(--line); padding: 6px 12px; color: var(--dim); }
.fan { position: absolute; right: 40px; top: 70px; width: 470px; height: 500px; }
.fan canvas { position: absolute; width: 240px; height: 320px; border-radius: 4px; box-shadow: 0 20px 60px rgba(0,0,0,.8); }
.fan canvas:nth-child(1) { left: 0; top: 70px; transform: rotate(-9deg); }
.fan canvas:nth-child(2) { left: 118px; top: 28px; transform: rotate(-1deg); z-index: 2; }
.fan canvas:nth-child(3) { left: 232px; top: 84px; transform: rotate(8deg); }
.frame { position: absolute; inset: 14px; border: 2px solid rgba(255,179,71,.6); box-shadow: 0 0 22px rgba(255,179,71,.25), inset 0 0 22px rgba(255,179,71,.12); pointer-events: none; }
</style></head>
<body>
<canvas id="bg" width="1200" height="630"></canvas>
<div class="txt">
  <div class="label">UNOFFICIAL FAN ARCHIVE · 2009 – 2099</div>
  <h1>BLADE RUNNER<span>ARCHIVE</span></h1>
  <p>Every comic, film, game, short and anime, told in story order.</p>
  <div class="chips"><b>3 ERAS</b><b>16 STORIES</b><b>18 CASE FILES</b></div>
</div>
<div class="fan"><canvas data-art="origins"></canvas><canvas data-art="lotus"></canvas><canvas data-art="film49"></canvas></div>
<div class="frame"></div>
<script>
(function () {
  var c = document.getElementById('bg'), g = c.getContext('2d'), w = 1200, h = 630, s = 7;
  function R() { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }
  var gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#080a16'); gr.addColorStop(1, '#2a130c'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  var gl = g.createRadialGradient(w * 0.82, h, 10, w * 0.82, h, h); gl.addColorStop(0, 'rgba(255,120,30,.45)'); gl.addColorStop(1, 'rgba(255,120,30,0)'); g.fillStyle = gl; g.fillRect(0, 0, w, h);
  var x = -10; while (x < w) { var bw = 26 + R() * 50, bh = 90 + R() * 230; g.fillStyle = '#0a0e1a'; g.fillRect(x, h - bh, bw, bh);
    for (var yy = h - bh + 8; yy < h - 6; yy += 10) for (var xx = x + 5; xx < x + bw - 5; xx += 8) if (R() < 0.18) { g.fillStyle = R() < 0.2 ? 'rgba(34,229,255,.6)' : 'rgba(255,179,71,.55)'; g.fillRect(xx, yy, 3, 5); }
    x += bw + 2; }
  g.fillStyle = 'rgba(7,9,16,.55)'; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(160,190,255,.2)'; g.beginPath(); for (var i = 0; i < 260; i++) { var rx = R() * w, ry = R() * h; g.moveTo(rx, ry); g.lineTo(rx - 3, ry + 16); } g.stroke();
  g.fillStyle = 'rgba(255,255,255,.025)'; for (var y = 0; y < h; y += 3) g.fillRect(0, y, w, 1);
})();
</script>
<script src="../src/scripts/art.js"></script>
</body></html>
